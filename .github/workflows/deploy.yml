name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Chrome dependencies for Puppeteer
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libnss3 libatk-bridge2.0-0 libdrm2 libxkbcommon0 \
            libgbm1 libasound2 libxshmfence1 libx11-xcb1 \
            libxcomposite1 libxdamage1 libxrandr2 libpango-1.0-0 \
            libcairo2 libatspi2.0-0 libgtk-3-0

      - name: Build (Vite)
        run: npm run build

      - name: Pre-render all pages to static HTML
        run: node scripts/prerender.js
        continue-on-error: true

      - name: Generate sitemap & fix robots.txt
        run: node scripts/generate-sitemap.js
        continue-on-error: true

      - name: Copy 404.html & .nojekyll
        run: |
          cp public/404.html dist/404.html
          touch dist/.nojekyll

      - name: Verify critical pages exist
        run: |
          echo "Checking deployed pages..."
          MISSING=0
          for page in dist/index.html dist/about/index.html dist/contact/index.html dist/privacy-policy/index.html dist/terms-of-service/index.html dist/guides/index.html; do
            if [ -f "$page" ]; then
              echo "✅ $page"
            else
              echo "❌ $page MISSING"
              MISSING=$((MISSING+1))
            fi
          done
          if [ $MISSING -gt 0 ]; then
            echo "::warning::$MISSING pages missing from prerender. Committed dist/ files will be used as fallback."
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
