name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify critical pages exist in dist/
        run: |
          echo "Checking pages in committed dist/..."
          MISSING=0
          for page in dist/index.html dist/about/index.html dist/contact/index.html dist/privacy-policy/index.html dist/terms-of-service/index.html dist/guides/index.html; do
            if [ -f "$page" ]; then
              echo "✅ $page"
            else
              echo "❌ $page MISSING"
              MISSING=$((MISSING+1))
            fi
          done
          if [ $MISSING -gt 0 ]; then
            echo "::error::$MISSING critical pages missing from dist/"
            exit 1
          fi
          echo "All critical pages present!"

      - name: Ensure .nojekyll exists
        run: touch dist/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
