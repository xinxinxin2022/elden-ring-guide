name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Chrome dependencies for Puppeteer
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libnss3 libatk-bridge2.0-0 libdrm2 libxkbcommon0 \
            libgbm1 libasound2 libxshmfence1 libx11-xcb1 \
            libxcomposite1 libxdamage1 libxrandr2 libpango-1.0-0 \
            libcairo2 libatspi2.0-0 libgtk-3-0

      - name: Build (Vite)
        run: npm run build

      - name: Pre-render all pages to static HTML
        run: node scripts/prerender.js

      - name: Generate sitemap & fix robots.txt
        run: node scripts/generate-sitemap.js

      - name: Copy 404.html
        run: cp public/404.html dist/404.html

      - name: Verify prerendered pages exist
        run: |
          echo "Checking prerendered pages..."
          test -f dist/index.html && echo "✅ dist/index.html"
          test -f dist/privacy-policy/index.html && echo "✅ dist/privacy-policy/index.html"
          test -f dist/about/index.html && echo "✅ dist/about/index.html"
          test -f dist/contact/index.html && echo "✅ dist/contact/index.html"
          test -f dist/terms-of-service/index.html && echo "✅ dist/terms-of-service/index.html"
          test -f dist/guides/index.html && echo "✅ dist/guides/index.html"
          test -f dist/guides/beginner-guide/index.html && echo "✅ dist/guides/beginner-guide/index.html"
          echo "All critical pages prerendered!"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
